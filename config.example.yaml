# aimon — AI subscription / credit monitor configuration.
#
# Copy to config.yaml and fill in (or, preferably, leave the ${ENV} refs and
# set the secrets via environment variables / docker-compose). ${VAR} and $VAR
# are expanded from the environment at load time.

listen: ":8080"
database: "./data/aimon.db"
poll_interval: 60s

# Externally reachable base URL — only needed for OAuth redirect URIs.
# public_url: "http://localhost:8080"

monitors:
  # --- Prepaid credit balances (fully supported) ---------------------------
  - provider: deepseek
    label: "DeepSeek"
    api_key: "${DEEPSEEK_API_KEY}"

  - provider: openrouter
    label: "OpenRouter"
    api_key: "${OPENROUTER_API_KEY}"

  # --- Anthropic API spend (Admin API, month-to-date cost) -----------------
  # Requires an Admin API key (sk-ant-admin-...), NOT a normal API key.
  - provider: anthropic
    label: "Anthropic API"
    admin_key: "${ANTHROPIC_ADMIN_KEY}"

  # --- Subscription usage via OAuth (best-effort) --------------------------
  # Claude Pro/Max: connect once at /  (Connect button) — opens the Anthropic
  # OAuth consent page, then paste the returned code back in. Tokens are stored
  # in SQLite and auto-refreshed.
  - provider: claude
    label: "Claude (Max)"
    oauth: true

  # x.ai SuperGrok: click "Connect" in the UI to authorize via OAuth (PKCE) —
  # aimon reads billing-cycle usage from the same grok.com endpoint the Grok
  # CLI's /usage uses. Alternatives: point token_file at a credential file an
  # external tool keeps refreshed, supply a static bearer_token, or fall back to
  # api_key (which only reports API-key status, not SuperGrok usage).
  - provider: xai
    label: "SuperGrok (hermes)"
    oauth: true
    # token_file: "~/.hermes/auth.json"   # or ~/.grok/auth.json
    # bearer_token: "${XAI_SESSION_TOKEN}"
    # api_key: "${XAI_API_KEY}"
